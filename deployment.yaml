apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-test-app
  template:
    metadata:
      labels:
        app: kubernetes-test-app
    spec:
      containers:
        - name: kubernetes-test-app
          image: kubernetes-test-app:latest
          # imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: "64Mi"
              cpu: "200m"
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-test-app
spec:
  type: NodePort
  selector:
    app: kubernetes-test-app
  ports:
    - port: 8080
      targetPort: 5000
      nodePort: 30007